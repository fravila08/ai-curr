<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Check 2 – Full Stack Development Breakdown</title>
  <link rel="stylesheet" href="static/index.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Knowledge Check 2</h1>
      <p class="subtitle">Full Stack Development Breakdown</p>
    </header>

    <!-- Menu -->
    <section id="menu-screen" class="screen">
      <p class="lead">Pick a quiz. Each one has 10 questions and you'll see right away whether you got it right, and why.</p>
      <div id="quiz-list" class="quiz-list"></div>
    </section>

    <!-- Question -->
    <section id="question-screen" class="screen" hidden>
      <div class="status">
        <span id="quiz-title" class="quiz-title"></span>
        <span id="progress-text"></span>
        <span id="score-text"></span>
      </div>
      <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>

      <h2 id="question-text" class="question"></h2>
      <div id="options" class="options"></div>

      <div id="feedback" class="feedback" role="status" aria-live="polite" hidden>
        <p id="feedback-title" class="feedback-title"></p>
        <p id="feedback-body"></p>
        <button id="next-btn" class="btn primary" type="button">Next question</button>
      </div>
    </section>

    <!-- Results -->
    <section id="results-screen" class="screen" hidden>
      <h2>Quiz complete</h2>
      <p id="final-score" class="final-score"></p>
      <p id="final-message" class="lead"></p>

      <div id="review" class="review" hidden>
        <h3>Review missed questions</h3>
        <ul id="review-list" class="review-list"></ul>
      </div>

      <div class="actions">
        <button id="retake-btn" class="btn primary" type="button">Retake quiz</button>
        <button id="menu-btn" class="btn" type="button">Back to menu</button>
      </div>
    </section>
  </main>

  <script src="static/main.js"></script>
</body>
</html>
